{{ define "main" }}

<header class="ledger-head">
  <h1>{{ .Title }}</h1>
  <span class="ledger-count">{{ len .Data.Terms }}</span>
</header>
{{ .Content }}
<ul class="tag-cloud">
{{ range .Data.Terms.ByCount }}
  <li><a href="{{ .Page.RelPermalink }}">#{{ .Page.Title }}<span class="tag-count">{{ .Count }}</span></a></li>
{{ end }}
</ul>

{{ end }}
